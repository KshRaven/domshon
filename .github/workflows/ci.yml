name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (server + client only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile all sources
        run: python -m compileall -q src scripts packaging
      - name: Import smoke test
        run: |
          python -c "import domshon, domshon.cli, domshon.server.app, domshon.client.sync"
          python -m domshon --version
      - name: Lint
        run: ruff check src --select E9,F63,F7,F82
      - name: Tests (if present)
        run: |
          if [ -d tests ]; then pytest -q; else echo "no tests yet"; fi
